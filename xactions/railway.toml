# NOT the live config. Railway reads railway.json first, and it exists, so this
# file is ignored: editing it alone changes nothing about a deploy.
# Kept for forks that prefer TOML. If you switch to it, delete railway.json.
# Settings below are mirrored from railway.json; change both or neither.
# See deploy/README.md.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
